services:
  notification-service:
    container_name: notification-service
    image: dimgit9/notification-service:dev
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production.local
    expose:
      - '9102'
    networks:
      - shared_net


networks:
  shared_net:
    external: true

